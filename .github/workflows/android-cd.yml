name: Android CD (Capacitor)

# Gera o AAB do app Android (o web empacotado no Capacitor) e publica na faixa de TESTE INTERNO da
# Google Play. Dispara quando um PR que mexeu no app (código, Android ou dependências) é MESCLADO na main
# (evento pull_request, nunca push solto), ou manualmente (workflow_dispatch).
#
# Não existe OTA: cada merge vira um binário novo na faixa interna (sem revisão do Google, chega em
# minutos). O app avisa o usuário quando há versão nova (organisms/AppUpdatePrompt).
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICE_ACCOUNT_JSON_BASE64  JSON da service account da Play em base64 (só faixas de teste)
#   ANDROID_KEYSTORE_BASE64             upload key (release.p12) em base64
#   ANDROID_KEYSTORE_PASSWORD           senha da keystore
#   ANDROID_KEY_ALIAS                   alias da chave
#   ANDROID_KEY_PASSWORD                senha da chave (PKCS12: a mesma da keystore)
#   VITE_API_URL / VITE_API_KEY         API embutida no build
#   DISCORD_WEBHOOK_URL                 (opcional) canal que recebe o aviso de sucesso/falha — o mesmo do web
# Variável do repositório (aba Variables):
#   VITE_WEB_URL                        URL pública do web, de onde o app lê /app-version.json
#   VITE_GOOGLE_CLIENT_ID               client ID OAuth "Web" do Google (login com o Google; vazio = sem o botão)

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "index.html"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-cd.yml"
      - ".github/scripts/play-publish.mjs"
  workflow_dispatch:

# Dois merges seguidos não podem calcular o mesmo versionCode: um espera o outro terminar.
concurrency:
  group: android-cd
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.chilllogic.myfinance.app

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do commit mesclado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Instala dependências
        run: npm ci

      - name: Credenciais (fora do repositório)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/play-service-account.json"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "PLAY_SERVICE_ACCOUNT_FILE=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: .env do web (embutido no build)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: printf 'VITE_API_URL=%s\nVITE_API_KEY=%s\nVITE_WEB_URL=%s\nVITE_GOOGLE_CLIENT_ID=%s\n' "$VITE_API_URL" "$VITE_API_KEY" "$VITE_WEB_URL" "$VITE_GOOGLE_CLIENT_ID" > .env

      - name: Calcula a versão (maior versionCode na Play + 1)
        id: version
        run: |
          CODE=$(node .github/scripts/play-publish.mjs next-version-code "$PACKAGE_NAME")
          # versionName = "<major.minor do package.json>.<versionCode>" (ex.: 0.3.101). O webapp mostra o
          # mesmo prefixo no "Sobre". Suba o `version` do package.json em marcos maiores.
          PREFIX=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          NAME="$PREFIX.$CODE"
          echo "ANDROID_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versão: $NAME ($CODE)"

      - name: Build web + sync Capacitor
        run: npm run cap:sync

      - name: Build do AAB assinado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Publica na faixa de teste interno
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          NOTES="${PR_TITLE:-Atualização do MyFinance}"
          node .github/scripts/play-publish.mjs upload "$PACKAGE_NAME" \
            android/app/build/outputs/bundle/release/app-release.aab \
            internal "${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" "$NOTES"

      - name: Guarda o AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Avisa o Discord do resultado (sucesso ou falha em qualquer passo). Sem o secret, não faz nada.
      - name: Notifica o Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          VERSION: ${{ steps.version.outputs.name && format('{0} ({1})', steps.version.outputs.name, steps.version.outputs.code) || '—' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && { echo "Sem DISCORD_WEBHOOK_URL — não notifica."; exit 0; }
          case "$STATUS" in
            success)   TITLE="✅ App Android publicado no teste interno"; COLOR=5763719 ;;
            cancelled) TITLE="⚪ CD do app Android cancelado";             COLOR=9807270 ;;
            *)         TITLE="❌ CD do app Android falhou";                COLOR=15158332 ;;
          esac
          if [ -n "$PR_NUMBER" ]; then ORIGIN="#$PR_NUMBER - $PR_TITLE"; else ORIGIN="Disparo manual"; fi
          jq -n \
            --arg title "$TITLE" --argjson color "$COLOR" --arg url "$RUN_URL" \
            --arg version "$VERSION" --arg origin "$ORIGIN" --arg commit "${SHA:0:7}" \
            --arg author "$AUTHOR" --arg repo "${{ github.repository }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: $title, color: $color, url: $url,
              fields: [
                {name: "Projeto", value: ($repo + " (Android)"), inline: true},
                {name: "Faixa", value: "Teste interno", inline: true},
                {name: "Versão", value: $version, inline: true},
                {name: "Origem", value: $origin, inline: false},
                {name: "Commit", value: $commit, inline: true},
                {name: "Autor", value: $author, inline: true}
              ],
              footer: {text: "GitHub Actions"}, timestamp: $ts
            }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
