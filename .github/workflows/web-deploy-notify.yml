name: Notify Discord on Deploy

# A Vercel faz o deploy do web sozinha (integração GitHub App dela) e marca o resultado no commit como
# um STATUS ("Vercel – <projeto>": pending → success/failure). Este workflow reage a esses statuses e
# avisa o Discord — sem polling na API da Vercel.
#
# Desde a saída do monorepo (2026-11-24) os projetos são `my-finance-ui-production` (main, domínio
# myfinance.app.br) e `my-finance-ui-stg` (staging). Eles NÃO criam mais "deployments" no GitHub, só o
# status do commit — por isso o gatilho é `status`, e não `deployment_status` como antes (que parou de
# disparar). Trocou o nome de um projeto na Vercel? Ajuste o mapa no passo "Decide se notifica".
#
# Obs.: workflows disparados por `status` rodam sempre a partir do arquivo que está na branch default do
# repo — só passa a valer depois do merge na main.
on:
  status

jobs:
  notify:
    runs-on: ubuntu-latest
    # Só statuses da Vercel em estado final; ignora pending.
    if: >
      startsWith(github.event.context, 'Vercel') &&
      github.event.state != 'pending'
    steps:
      # Cada projeto também gera prévias de outras branches (o de staging builda até a main), então só
      # notifica o par certo: projeto de produção + commit na PONTA da main, projeto de staging + ponta
      # da staging. A ponta vem da API (branches-where-head): o `branches` do evento lista as branches
      # que CONTÊM o commit, e a prévia de uma branch de PR que termina depois do merge já aparece "na
      # main" — avisava como Produção (aconteceu no #77).
      - name: Decide se notifica
        id: gate
        env:
          CONTEXT: ${{ github.event.context }}
          SHA: ${{ github.event.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCHES=$(gh api "repos/${{ github.repository }}/commits/${SHA}/branches-where-head" --jq '.[].name' 2>/dev/null || echo "")
          echo "Status: $CONTEXT · ${SHA:0:7} é ponta de: ${BRANCHES:-<nenhuma>}"
          case "$CONTEXT" in
            *my-finance-ui-production) WANT=main;    ENV_LABEL="Produção" ;;
            *my-finance-ui-stg)        WANT=staging; ENV_LABEL="Staging" ;;
            *) echo "Projeto desconhecido — não notifica."; echo "notify=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          for b in $BRANCHES; do
            if [ "$b" = "$WANT" ]; then
              echo "notify=true" >> "$GITHUB_OUTPUT"
              echo "branch=$WANT" >> "$GITHUB_OUTPUT"
              echo "env_label=$ENV_LABEL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Commit não é a ponta da $WANT — prévia ou commit antigo, não notifica."
          echo "notify=false" >> "$GITHUB_OUTPUT"

      - name: Notifica o Discord
        if: steps.gate.outputs.notify == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE: ${{ github.event.state }}
          TARGET_URL: ${{ github.event.target_url }}
          SHA: ${{ github.event.sha }}
          COMMIT_MSG: ${{ github.event.commit.commit.message }}
          AUTHOR: ${{ github.event.commit.commit.author.name }}
          BRANCH: ${{ steps.gate.outputs.branch }}
          ENV_LABEL: ${{ steps.gate.outputs.env_label }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && { echo "Sem DISCORD_WEBHOOK_URL — não notifica."; exit 0; }
          if [ "$STATE" = "success" ]; then
            TITLE="✅ Deploy web concluído"; COLOR=5763719
          else
            TITLE="❌ Deploy web falhou"; COLOR=15158332
          fi
          # Mensagem de merge = "Merge pull request #N ...\n\n<título>": mostra o título do PR.
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | awk 'NF' | sed -n '2p')
          [ -z "$SUBJECT" ] && SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1)
          # jq monta o JSON: aspas e quebras de linha da mensagem não quebram o payload.
          jq -n \
            --arg title "$TITLE" --argjson color "$COLOR" --arg url "$TARGET_URL" \
            --arg env "$ENV_LABEL" --arg branch "$BRANCH" \
            --arg commit "${SHA:0:7} - $SUBJECT" --arg author "$AUTHOR" \
            --arg repo "${{ github.repository }}" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: $title, color: $color, url: $url,
              fields: [
                {name: "Projeto", value: ($repo + " (web)"), inline: true},
                {name: "Ambiente", value: $env, inline: true},
                {name: "Branch", value: $branch, inline: true},
                {name: "Commit", value: $commit, inline: false},
                {name: "Autor", value: $author, inline: true}
              ],
              footer: {text: "GitHub Actions"}, timestamp: $ts
            }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
