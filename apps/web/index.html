<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/brand/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFinance</title>
  <!--
    Aplica o tema antes do React montar, para não piscar o tema errado no carregamento.
    Mesma regra do ThemeProvider (src/context/theme.tsx): preferência salva, senão o tema do sistema.
  -->
  <script>
    (function () {
      var pref = null;
      try { pref = localStorage.getItem('theme-preference'); } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
